plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.socialxcamera'
version = '1.0.0'
android { namespace 'expo.modules.socialxcamera' }
configurations.configureEach {
  resolutionStrategy.force 'com.google.guava:listenablefuture:1.0'
}
dependencies {
  implementation 'androidx.camera:camera-camera2:1.6.0'
  implementation 'androidx.camera:camera-lifecycle:1.6.0'
  implementation 'androidx.camera:camera-video:1.6.0'
  implementation 'androidx.camera:camera-view:1.6.0'
  implementation 'androidx.camera.media3:media3-effect:1.0.0-alpha04'
  // Match Expo Video's Media3 version to avoid binary-incompatible dependency resolution.
  implementation 'androidx.media3:media3-effect:1.9.0'
}
